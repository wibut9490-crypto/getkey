<?php
session_start();

// Lấy Token từ URL (Ví dụ: getkey.php?token=123xyz)
$token = $_GET['token'] ?? '';
$isValid = false;

// Kiểm tra xem Token có hợp lệ trong Session không
if (!empty($token) && isset($_SESSION['tokens'][$token])) {
    $createdTime = $_SESSION['tokens'][$token];
    
    // Giới hạn Token chỉ có hiệu lực trong 5 phút (300 giây)
    if ((time() - $createdTime) <= 300) {
        $isValid = true;
        
        // Tạo Key ngẫu nhiên (hoặc bạn tự đổi thành Key cố định/Key lấy từ database)
        $userKey = "KEY-" . strtoupper(substr(md5(uniqid(rand(), true)), 0, 12));
        
        // XÓA TOKEN NGAY LẬP TỨC để ngăn chia sẻ link hoặc tải lại trang
        unset($_SESSION['tokens'][$token]);
    }
}
?>
